<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PSO2NGS — クエストメンバー募集</title>
<style>
:root{--bg:#080c12;--panel:#101722;--panel2:#151e2a;--line:#263243;--text:#eef3f8;--muted:#8d9aad;--accent:#65b7ff;--green:#48d597;--yellow:#f0c85b;--red:#ff6f7d;--shadow:0 18px 50px #0007}
*{box-sizing:border-box}
html, body{overflow-x:hidden; width:100%}
body{margin:0;background:radial-gradient(circle at 50% -10%,#17283b 0,#080c12 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr;width:100%;max-width:100vw;overflow-x:hidden}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:#0b1018eF;backdrop-filter:blur(14px)}
.brand{font-weight:800;letter-spacing:.04em;font-size:17px;margin:0 8px 30px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:5px}
.nav{display:grid;gap:8px}
.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:10px}
.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.create{margin-top:18px;width:100%;border:0;background:var(--accent);color:#07111d;font-weight:800;padding:13px;border-radius:10px}
.side-foot{position:absolute;bottom:18px;left:16px;right:16px;color:var(--muted);font-size:11px}
.main{width:100%;max-width:1050px;margin:auto;padding:22px 26px 100px;min-width:0}
.mobilebar{display:none}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700}
.title{font-size:30px;font-weight:850;margin:3px 0}
.sub{color:var(--muted);font-size:13px;word-break:break-word}
.filters{background:#0d141e;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input,.ship-filter-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:150px;max-width:100%}
.ship-filter{position:relative}
.ship-filter-btn{width:100%;text-align:left}
.ship-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;width:310px;max-width:80vw;background:#0d141e;border:1px solid var(--line);border-radius:12px;padding:10px;z-index:40;box-shadow:var(--shadow)}
.ship-menu.open{display:block}
.ship-menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.mini{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:5px 7px;font-size:11px}
.ship-options{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ship-options label{padding:8px;border-radius:8px;background:var(--panel);font-size:12px}
.ship-options input{margin-right:6px;min-width:auto}
.statline{display:flex;gap:10px;color:var(--muted);font-size:12px;margin:10px 2px 16px;flex-wrap:wrap}
.stat{background:#0d141e;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.cards{display:grid;gap:10px}
.card{background:linear-gradient(145deg,#121b27,#0e151f);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 8px 25px #0002;max-width:100%}
.card.hot{border-color:#5c4c21;box-shadow:0 0 0 1px #f0c85b22,0 10px 30px #0003}
.cardhead{display:flex;justify-content:space-between;gap:12px}
.quest{font-weight:800;font-size:17px;word-break:break-word}
.ship{color:var(--muted);font-size:12px;margin-top:3px}
.count{font-weight:850;font-size:18px;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 8px}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#192331;border:1px solid #2c3a4d;color:#cbd6e3;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge.green{color:#a6f3cf;border-color:#245f4a;background:#10271f}
.badge.hot{color:#ffe39a;border-color:#695622;background:#282212}
.comment{font-size:13px;line-height:1.55;color:#d6dee8;min-height:20px;word-break:break-word}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;color:var(--muted);font-size:11px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line);min-height:40px;background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07111d;font-weight:800}
.btn.danger{background:#29151a;border-color:#5c2831;color:#ffadb5}
.empty{padding:45px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}
.page{display:none}
.page.active{display:block}
.chatlist{display:grid;gap:9px;width:100%}
.chat-toolbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:2px;flex-wrap:wrap}
.chat-row{position:relative;width:100%;min-width:0}
.chat-row>div{flex:1;min-width:0;overflow:hidden;cursor:pointer}
.chat-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-check{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.room{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:100%}
.chat-row.has-unread{border-color:#3f657f;box-shadow:0 0 0 1px #3f657f33}
.unread-badge{margin-left:5px;vertical-align:middle}
.room small{color:var(--muted)}
.chatbox{height:calc(100vh - 150px);min-height:500px;background:var(--panel);border:1px solid var(--line);border-radius:15px;display:grid;grid-template-rows:auto 1fr auto;width:100%;min-width:0}
.chatinfo{padding:15px;border-bottom:1px solid var(--line)}
.messages{padding:16px;overflow:auto;display:grid;align-content:start;gap:8px}
.msg{max-width:78%;background:var(--panel2);padding:9px 11px;border-radius:11px;font-size:13px;word-break:break-word}
.msg.me{margin-left:auto;background:#17334b}
.msg small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap;background:#0d141e}
.composer input{min-width:0;flex:1;background:#0b1119;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:99px}
.room-actions{display:flex;gap:7px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:#0b1119;border:1px solid var(--line);color:var(--text);border-radius:99px;padding:10px}
.field textarea{border-radius:9px;resize:vertical}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.check{border:1px solid var(--line);background:var(--panel);padding:9px 10px;border-radius:99px;font-size:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.open{display:flex}
.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#0e151f;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.dialog h2{margin:0 0 18px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.notice{padding:10px 12px;border-radius:10px;background:#132238;border:1px solid #28496b;color:#bcdcff;font-size:12px;margin-bottom:12px;word-break:break-word}
.profile{display:grid;gap:14px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}
.kv span:last-child{color:var(--muted);word-break:break-all;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#eaf5ff;color:#08131f;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:800;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){
  html,body{width:100%;min-height:100%;overflow-x:hidden}
  body{min-height:100dvh;overflow-y:auto}
  .app{display:block;min-height:100dvh}
  .side{display:none}
  .main{width:100%;max-width:100%;padding:0 10px calc(66px + env(safe-area-inset-bottom));box-sizing:border-box;min-height:100dvh}
  .mobilebar{display:flex;position:sticky;top:0;z-index:20;margin:0 -10px 12px;padding:10px 12px;background:#0b1018f2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);justify-content:space-between;align-items:center}
  .mobilebar strong{font-size:14px}.mobilebar small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.mobilebar button{background:transparent;border:0;color:var(--muted);font-size:18px}
  .top{align-items:start;margin-bottom:10px}.title{font-size:22px}.eyebrow{font-size:9px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ship-filter{grid-column:1/-1}.filters select,.filters input,.ship-filter-btn{width:100%;min-width:0;box-sizing:border-box}
  .statline{overflow:hidden;gap:6px;flex-wrap:wrap}.stat{font-size:11px}
  .cards,.chatlist{gap:7px}.card{padding:11px;margin:0}.actions .btn,.chat-row .btn{min-width:auto;padding:7px 9px;font-size:11px}
  .meta{flex-wrap:wrap;gap:5px}.chat-row{min-height:44px;padding:8px}.chat-row>div:first-child{min-width:0}
  .chatbox{height:calc(100dvh - 145px);min-height:0;max-height:calc(100dvh - 145px);border-radius:12px;overflow:hidden}
  .chatinfo{padding:10px}.messages{padding:10px;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain}.msg{max-width:86%;padding:8px 9px;font-size:12px}
  .room-actions{padding:7px;gap:5px;flex-wrap:wrap}.room-actions .btn,.composer .btn{min-height:38px;padding:8px 10px}
  .composer{padding:7px;gap:6px;flex-wrap:wrap}.composer input{order:1;flex:1 1 100%;min-height:38px;box-sizing:border-box}.composer .btn{order:2}
  .bottomnav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b1018f5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{border:0;background:transparent;color:var(--muted);padding:7px 4px;font-size:10px;min-width:0}
  .dialog{width:min(680px,100%);max-height:calc(100dvh - 16px);overflow-y:auto;padding:13px;box-sizing:border-box}.modal{padding:8px}.dialog h2{font-size:19px;margin-bottom:12px}.formgrid{grid-template-columns:1fr;gap:9px}.field.full{grid-column:auto}.field input,.field select,.field textarea{padding:9px}.dialog-actions{margin-top:12px}
}
@media(max-width:380px){
  .main{padding-left:7px;padding-right:7px}.mobilebar{margin-left:-7px;margin-right:-7px;padding-left:9px;padding-right:9px}.title{font-size:20px}.filters{grid-template-columns:1fr}.ship-filter{grid-column:auto}.actions{gap:4px}.actions .btn,.chat-row .btn{padding:6px 7px;font-size:10px}.card{padding:9px}.chatbox{height:calc(100dvh - 132px);max-height:calc(100dvh - 132px)}
}
</style>
</head>
<body>
<div style="position:fixed;right:10px;top:8px;z-index:9999;font-size:10px;opacity:.45">v4.31 · production fixed</div>
<div class="app">
<aside class="side"><div class="brand">NGS LFG<small>クエストメンバー募集</small></div><nav class="nav"><button class="active" data-page="list">📋 募集一覧</button><button data-page="chat">💬 チャット</button><button data-page="profile">👤 プロフィール</button></nav><div class="side-foot">Production fixed v4.31<br><span id="backendStatus">接続確認中…</span> <button id="backendRetry" class="mini" style="display:none" onclick="location.reload()">再接続</button><br>ログイン操作なし・匿名IDで設定を保持</div></aside>

t">🚫 <b id="blockedCount">0</b>人を非表示</span></div><div id="cards" class="cards"></div></section>
<section id="page-chat" class="page"><div class="top"><div><div class="eyebrow">PARTY ROOMS</div><div class="title">チャット</div></div></div><div id="chatList" class="chatlist"></div><div id="chatRoom" style="display:none"></div></section>

</main></div>
<div class="bottomnav"><button class="active" data-page="list">📋<br>募集</button><button data-page="chat">💬<br>チャット</button><button data-page="profile">👤<br>設定</button></div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>
<script>
const SUPABASE_SDK_URLS=[
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0',
  'https://unpkg.com/@supabase/supabase-js@2.116.0'
];
let supabaseSdkPromise=null;
function loadSupabaseSdk(){
  if(window.supabase?.createClient)return Promise.resolve();
  if(supabaseSdkPromise)return supabaseSdkPromise;
  supabaseSdkPromise=(async()=>{
    for(const src of SUPABASE_SDK_URLS){
      try{
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');s.src=src;s.async=true;
          s.onload=()=>resolve();s.onerror=()=>reject(new Error('SDK load failed: '+src));
          document.head.appendChild(s);
        });
        if(window.supabase?.createClient)return;
      }catch(e){console.warn(e)}
    }
    throw new Error('Supabase SDKを読み込めませんでした');
  })();
  return supabaseSdkPromise;
}

const KEY='ngs_party_v428';
const LEGACY_KEYS=['ngs_party_v424','ngs_party_v423','ngs_party_v422','ngs_party_v421','ngs_party_v420','ngs_party_v419','ngs_party_v418','ngs_party_v38','ngs_party_v37','ngs_party_v36','ngs_party_v35','ngs_party_v34','ngs_party_v33','ngs_party_v32','ngs_party_v31','ngs_party_v30','ngs_party_v29','ngs_party_v28','ngs_party_v27','ngs_party_v26','ngs_party_v25','ngs_party_v24','ngs_party_v23','ngs_party_v22','ngs_party_v21','ngs_party_v20','ngs_party_v19','ngs_party_v15','ngs_party_v16','ngs_party_v17','ngs_party_v18'];
if(!localStorage.getItem(KEY)){for(const k of LEGACY_KEYS){const raw=localStorage.getItem(k);if(raw){try{localStorage.setItem(KEY,raw);break}catch{}}}}
const SUPABASE_URL='https://touglesmrhujtswkldmf.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_MCCErF5zf5KSyREV4Yrnaw_5dNoHqR5';
let sb=null, authReady=false, realtime=[], actionBusy=false, loadSeq=0, loadInFlight=false, loadQueued=false, loadQueuedOpenRoom=false, realtimeTimer=null, roomMessageSeq={}, roomMessageInFlight={}, backendRetryTimer=0, backendRetryMs=1000, backendLastError='', backendInitInFlight=null, backendPollTimer=0, realtimeRetryTimer=0, realtimeRetryMs=1000, realtimeGeneration=0, authListenerBound=false, authCheckInFlight=null, lastStableAuthAt=0, connectionGeneration=0;
let chatSelectionMode=false, selectedChatIds=new Set();
function beginAction(){if(actionBusy){toast('処理中です。少し待ってください');return false}actionBusy=true;return true}
function endAction(){actionBusy=false}
const backendConfigured=()=>SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.length>20;
const backendEnabled=()=>backendConfigured()&&!!window.supabase?.createClient;
const requireBackend=()=>{if(sb&&authReady)return true;toast('サーバーに接続中です。接続完了後にもう一度お試しください');return false}
const now=()=>Date.now();
let quests={"想定演習：三路縦走戦":12,"高難度クエスト":4,"デクスト金策":8};
const CONDITION_TAGS=['武器上昇値700%以上'];
function questCapacity(q){return quests[q]||4}
function questRecruitSlots(q){return Math.max(1,questCapacity(q)-1)}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,templates:[{name:'ガチ周回',text:'効率重視で周回します。'}],blocked:[],recruitments:[],rooms:[],hiddenChats:[],readAt:{}};
if(backendConfigured()){db.recruitments=[];db.rooms=[];db.hiddenChats=[];db.blocked=[]}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function normalizeConditionTags(tags){return Array.isArray(tags)&&tags.includes('武器上昇値700%以上')?['武器上昇値700%以上']:[]}

// 募集が現在アクティブ（募集一覧に存在し、open状態）かを判定
function isRecruitmentActive(recruitmentId){
  if(!recruitmentId) return false;
  let r = db.recruitments.find(x => x.id === recruitmentId);
  return !!r && recruitmentState(r) === 'open';
}

// 修正：実際の未読メッセージが存在する場合のみ未読件数をカウント
function unreadCount(room){
  // 承認待ち・未読み込み状態では、未確認の「最後のメッセージ」を
  // 未読1件として推測しない。実際に取得できた通常チャットだけを数える。
  if((room.pendingIds||[]).includes(db.user?.id)) return 0;
  if(!room.messagesLoaded) return 0;
  const readTime = db.readAt?.[room.id] || 0;
  const validMsgs = (room.messages||[]).filter(filterSystemMsg);
  return validMsgs.filter(m =>
    m.uid !== db.user?.id && Number(m.time) > readTime
  ).length;
}

function markRoomRead(id){db.readAt=db.readAt||{};db.readAt[id]=now();save()}
function uid(){return crypto.randomUUID()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeId(id){
  const v=String(id??'');
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)?v:'';
}
function requireSafeId(id){
  const v=safeId(id);
  if(!v) throw new Error('INVALID_IDENTIFIER');
  return v;
}
function normalizeShipForBackend(ship){
  return ship==='全体シップ'?'Ship 1':ship;

async function initBackend(){
  if(!backendConfigured()){setBackendStatus('Supabase未設定');render();return false}
  if(authReady && sb && db.user?.id){
    setBackendStatus(navigator.onLine===false?'オフライン':'オンライン（匿名接続）');
    return true;
  }
  if(backendInitInFlight)return backendInitInFlight;
  backendInitInFlight=(async()=>{
    let phase='SDK';
    try{
      await loadSupabaseSdk();
      phase='クライアント初期化';
      if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,lock:async(_name,acquireTimeout,fn)=>fn()}});
      phase='認証確認';
      let data=null,error=null;
      try{
        ({data,error}=await sb.auth.getSession());
      }catch(e){ error=e; }
      if(error && authReady && db.user?.id){
        console.warn('Transient getSession error; retaining stable auth state',error);
        setBackendStatus(navigator.onLine===false?'オフライン':'オンライン（匿名接続）');
        return true;
      }
      if(error)throw error;
      if(!data?.session){
        phase='匿名認証';
        const r=await sb.auth.signInAnonymously();
        if(r.error)throw r.error;
        data=r.data;
        if(!data?.session){
          phase='認証セッション取得';
          const sessionResult=await sb.auth.getSession();
          if(sessionResult.error)throw sessionResult.error;
          data=sessionResult.data;
        }
      }
      const au=data?.session?.user;
      if(!au)throw new Error('anonymous session unavailable');
      authReady=true;
      lastStableAuthAt=Date.now();
      connectionGeneration++;
      backendRetryMs=1000; backendLastError='';
      db.user=db.user||{id:au.id,ship:'全体シップ',displayName:'',anonymous:true};
      db.user.id=au.id; save();
      if(!authListenerBound){
        authListenerBound=true;
        sb.auth.onAuthStateChange((event,session)=>{
          if(event==='SIGNED_OUT'){
            authReady=false;
            lastStableAuthAt=0;
            realtime.forEach(x=>{try{sb.removeChannel(x)}catch{}}); realtime=[];
            setBackendStatus('接続を確認中…');
            clearTimeout(backendRetryTimer);
            backendRetryTimer=setTimeout(()=>{backendRetryTimer=0;initBackend()},1200);
            return;
          }
          if(session?.user?.id){
            lastStableAuthAt=Date.now();
            const changed=db.user?.id!==session.user.id;
            authReady=true;
            db.user=db.user||{id:session.user.id,ship:'全体シップ',displayName:'',anonymous:true};
            db.user.id=session.user.id;
            save();
            if(changed)requestBackendRefresh(false);
            setBackendStatus(navigator.onLine===false?'オフライン':'オンライン（匿名接続）');
          }
        });
      }
      setBackendStatus('オンライン（匿名接続）');
      try{await syncProfileFromBackend()}catch(e){console.warn('Profile sync failed',e);backendLastError=backendErrorDetail(e,'プロフィール同期')}
      try{await loadQuestCatalog()}catch(e){console.warn('Quest catalog failed',e)}
      try{await loadBackendState()}catch(e){console.warn('Initial backend data refresh failed',e)}
      subscribeRealtime();
      ensureBackendPoller();
      render(); renderRooms();
      return true;
    }catch(e){
      console.warn('Supabase init failed',phase,e);
      if(authReady && db.user?.id){
        backendLastError=backendErrorDetail(e,phase);
        setBackendStatus(navigator.onLine===false?'オフライン':'オンライン（匿名接続）');
        return true;
      }
      authReady=false;
      backendLastError=backendErrorDetail(e,phase);
      setBackendStatus(navigator.onLine===false?'オフライン':backendLastError);
      if(navigator.onLine!==false)scheduleBackendInitRetry();
      return false;
    }finally{backendInitInFlight=null}
  })();
  return backendInitInFlight;
}
function scheduleBackendInitRetry(){
  if(backendRetryTimer)return;
  const wait=Math.min(15000,backendRetryMs);
  backendRetryMs=Math.min(15000,backendRetryMs*2);
  backendRetryTimer=setTimeout(()=>{backendRetryTimer=0;if(!authReady)initBackend()},wait);
}
function ensureBackendPoller(){

function subscribeRealtime(){
  if(!sb||!authReady||!db.user?.id)return;
  const generation=++realtimeGeneration;
  realtime.forEach(x=>{try{sb.removeChannel(x)}catch{}}); realtime=[];
  clearTimeout(realtimeTimer); realtimeTimer=null;
  clearTimeout(realtimeRetryTimer); realtimeRetryTimer=null; realtimeRetryMs=1000;
  const queueRefresh=(openRoomToo=false)=>{
    if(generation!==realtimeGeneration)return;
    clearTimeout(realtimeTimer);
    realtimeTimer=setTimeout(()=>{realtimeTimer=null;requestBackendRefresh(openRoomToo)},750);
  };
  const scheduleRealtimeRetry=()=>{
    if(realtimeRetryTimer||generation!==realtimeGeneration)return;
    const wait=realtimeRetryMs; realtimeRetryMs=Math.min(15000,realtimeRetryMs*2);
    realtimeRetryTimer=setTimeout(()=>{realtimeRetryTimer=null;if(authReady&&generation===realtimeGeneration)subscribeRealtime()},wait);
  };
  const ch=sb.channel('ngs-party-realtime-'+db.user.id+'-'+generation)
    .on('postgres_changes',{event:'*',schema:'public',table:'recruitments'},queueRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'recruitment_members'},queueRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'recruitment_requests'},()=>queueRefresh(true))
    .on('postgres_changes',{event:'*',schema:'public',table:'party_room_members'},queueRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'party_rooms'},queueRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},p=>{
      const roomId=p.new?.room_id||p.old?.room_id;
      if(!roomId||!db.rooms.some(r=>r.id===roomId))return;
      const open=document.getElementById('chatRoom')?.dataset.openRoom;
      if(open===roomId)refreshOpenRoomMessages(roomId); else queueRefresh();
    })
    .subscribe(status=>{
      if(generation!==realtimeGeneration)return;
      if(status==='SUBSCRIBED'){realtimeRetryMs=1000;setBackendStatus('オンライン（匿名接続）')}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){scheduleRealtimeRetry(); if(authReady)setBackendStatus('オンライン（匿名接続）');}
    });
  realtime.push(ch);
}

async function join(id){
  id=safeId(id);if(!id)return toast('不正な募集IDです');
  if(!ensureUser()||(backendConfigured()&&!requireBackend())||!beginAction())return;
  try{
    if(sb&&authReady){
      let {data,error}=await sb.rpc('join_recruitment',{p_recruitment:id});
      if(error){toast(apiError(error));return}
      closeModal();
      await loadBackendState();
      render();
      if(data?.room_id){
        markRoomRead(data.room_id);
        showPage('chat');
        await openRoom(data.room_id);
        toast(data?.status==='joined'?'参加しました':'参加申請を送りました');
      }else if(data?.status==='joined'){
        let roomResult=await sb.rpc('open_party_room',{p_recruitment:id});
        if(!roomResult.error && roomResult.data){
          markRoomRead(roomResult.data);
          await loadBackendState();
          showPage('chat');
          await openRoom(roomResult.data);
          toast('参加しました');
        }else{
          showPage('chat');
          renderRooms();
          toast('参加しました。チャット画面を確認してください');
        }
      }else{
        toast('参加申請を送りました');
      }
      return;
    }
    let r=db.recruitments.find(x=>x.id===id);
    if(!r)return;
    if(r.hostId===db.user.id)return toast('自分の募集です');
    if(r.members.length-1>=r.max)return toast('満員です');
    if(r.mode==='open'){
      if(!r.members.includes(db.user.id)) r.members.push(db.user.id);
      r.current=r.members.length-1;
      let rm=createRoomFor(r);
      if(rm && !rm.participants.includes(db.user.id)) rm.participants.push(db.user.id);
      if(rm) markRoomRead(rm.id);
      save();
      closeModal();
      toast('参加しました');
      showPage('chat');
      renderRooms();
      openRoom(rm.id);
    }else{
      if(r.pending.includes(db.user.id))return toast('すでに申請済みです');
      r.pending.push(db.user.id);
      save();
      closeModal();
      toast('参加申請を送りました');
      render();
    }
  }finally{endAction()}
}

async function openRoomForRecruitment(id){
  id=safeId(id);if(!id)return toast('不正な募集IDです');

  if(!beginAction())return;
  try{

      let r=db.recruitments.find(x=>x.id===id);

      let room=db.rooms.find(x=>x.recruitmentId===id);

        let {data,error}=await sb.rpc('open_party_room',{p_recruitment:id});

        room=db.rooms.find(x=>x.recruitmentId===id);
      } else {
        if(db.hiddenChats.includes(room.id)){
          db.hiddenChats = db.hiddenChats.filter(x => x !== room.id);
        }
      }
      if(room){
        room.deletedBy = (room.deletedBy||[]).filter(u => u !== db.user.id);
        markRoomRead(room.id);
        showPage('chat');
        await openRoom(room.id);
      }
      return;
    }
    let room=db.rooms.find(x=>x.recruitmentId===id);

    if(sb&&authReady){
      for(const id of ids){
        let {error}=await sb.rpc('hide_chat',{p_room:id});
        if(error){toast(apiError(error));return}
      }
      await loadBackendState();
      selectedChatIds.clear();
      renderRooms();
      toast(`${ids.length}件を非表示にしました`);
      return;
    }
    db.rooms.forEach(room=>{if(ids.includes(room.id)&&!room.deletedBy.includes(db.user.id))room.deletedBy.push(db.user.id)});
    save();
    selectedChatIds.clear();
    renderRooms();
    toast(`${ids.length}件のチャットを削除しました`);
  }finally{endAction()}
}

// 一括削除
async function deleteAllChats(){
  if(backendConfigured()&&!requireBackend())return;
  
  let rooms = db.rooms.filter(room => room.participants?.includes(db.user.id) && !room.deletedBy.includes(db.user.id));

  if(!rooms.length) return toast('非表示にできる過去のチャットはありません');

  if(!confirm(`${rooms.length}件の履歴を一覧から非表示にしますか？\n会話データ自体は他の参加者からは消えません。`))return;
  if(!beginAction())return;
  try{
    if(sb&&authReady){
      for(const room of rooms){
        let {error}=await sb.rpc('hide_chat',{p_room:room.id});
        if(error){toast(apiError(error));return}
      }
      await loadBackendState();
      renderRooms();
      toast(`${rooms.length}件を非表示にしました`);
      return;
    }
    rooms.forEach(r=>r.deletedBy.push(db.user.id));
    save();
    renderRooms();
    toast(`${rooms.length}件のチャットを削除しました`);
  }finally{endAction()}
}

function roomInfo(room){return{quest:room.quest||'クエスト',ship:normalizeShipForDisplay(room.ship||'全体シップ'),hostId:room.hostId||'',hostName:room.hostName||'募集主',max:room.max||1,members:room.membersSnapshot||[]}}

// 修正：再レンダリング時にもユーザーの選択モード状態およびチェック項目を維持
function renderRooms(){
  if(!db.user?.id)return;
  
  // 選択状態は DOM ではなく state で保持し、定期的な再描画でも解除しない。
  let isSelecting = chatSelectionMode;
  let selectedIds = new Set(selectedChatIds);

  let rooms=db.rooms.filter(room=>room.participants?.includes?.(db.user.id)&&!room.deletedBy?.includes?.(db.user.id));
  rooms.sort((a,b)=>{let au=unreadCount(a)>0,bu=unreadCount(b)>0;if(au!==bu)return bu-au;return (b.lastActivity||lastMsgTime(b))-(a.lastActivity||lastMsgTime(a))});
  
  let pendingRooms=rooms.filter(room=>{
    let recExists = isRecruitmentActive(room.recruitmentId);
    return recExists && room.hostId===db.user.id && (room.pendingIds||[]).length>0;
  });
  
  chatList.innerHTML=rooms.length?`<div class="chat-toolbar">${pendingRooms.length?`<span class="badge hot">🔔 参加申請 ${pendingRooms.reduce((n,r)=>n+r.pendingIds.length,0)}件</span>`:''}<button class="btn" onclick="toggleChatSelect()">${isSelecting?'選択を終了':'選択'}</button><button class="btn danger" onclick="deleteAllChats()">すべて削除</button></div><div id="chatRows">${rooms.map(room=>{
    let r=roomInfo(room);
    let isPending=(room.pendingIds||[]).includes(db.user.id);
    let validMsgs = (room.messages||[]).filter(filterSystemMsg);
    let last = room.lastMessage && filterSystemMsg(room.lastMessage) ? room.lastMessage : (validMsgs.length ? validMsgs[validMsgs.length-1] : null);
    
    // チャット一覧には「進行中」を表示しない。
    let recActive = isRecruitmentActive(room.recruitmentId);
    let status = room.closed ? '終了済み' : (isPending ? '承認待ち' : '');
    
    let unread=unreadCount(room);
    let pending = recActive && room.hostId===db.user.id && (room.pendingIds||[]).length;
    let previewText = (!isPending && last) ? esc(last.text) : '';
    let isChecked = selectedIds.has(room.id);

    return `<div class="room chat-row ${unread?'has-unread':''}"><input class="chat-check" type="checkbox" value="${room.id}" ${isChecked?'checked':''} style="display:${isSelecting?'block':'none'}"><div onclick="openRoom('${room.id}')"><strong>${esc(r.quest)} ${unread?`<span class="badge green unread-badge">未読 ${unread}</span>`:''}${pending?` <span class="badge hot unread-badge">🔔 申請 ${room.pendingIds.length}件</span>`:''}</strong><small>${esc(r.ship)}${status ? ' · ' + status : ''}${previewText ? ' · ' + previewText : ''}</small></div><button class="btn primary" onclick="openRoom('${room.id}')">開く</button></div>`
  }).join('')}</div><div id="bulkChatActions" class="chat-toolbar" style="display:${isSelecting?'flex':'none'}"><button class="btn danger" onclick="deleteSelectedChats()">選択したチャットを削除</button></div>`:`<div class="empty">チャット履歴はありません。<br><br>募集を作成・参加するとここに表示されます。</div>`;

  // 選択状態を再描画後も維持する。
  chatSelectionMode=isSelecting;
  chatList.classList.toggle('selecting',isSelecting);
  const visibleIds=new Set(rooms.map(r=>r.id));
  selectedChatIds=new Set([...selectedIds].filter(id=>visibleIds.has(id)));
  chatList.querySelectorAll('.chat-check').forEach(x=>{
    x.checked=selectedChatIds.has(x.value);
    x.onchange=()=>{if(x.checked)selectedChatIds.add(x.value);else selectedChatIds.delete(x.value)};
  });
}

function openUserActions(userId,roomId,recruitmentId){openModal(`<h2>ユーザー操作</h2><div class="notice">非表示は自分だけに適用されます。通報は運営確認用です。</div><div class="dialog-actions"><button class="btn danger" onclick="blockUser('${userId}')">このユーザーを非表示</button><button class="btn" onclick="openReport('${userId}','${recruitmentId||''}','${roomId||''}')">通報</button><button class="btn" onclick="closeModal()">キャンセル</button></div>`)}
async function openRoom(id,opts={}){
  id=safeId(id);if(!id)return;
  let room=db.rooms.find(x=>x.id===id);if(!room||!room.participants?.includes?.(db.user.id))return;
  if(room.deletedBy?.includes(db.user.id)){
    room.deletedBy = room.deletedBy.filter(u => u !== db.user.id);
  }
  if(db.hiddenChats.includes(room.id)){
    db.hiddenChats = db.hiddenChats.filter(x => x !== room.id);
  }
  let previousHeight=opts.preserveScroll?document.getElementById('msgs')?.scrollHeight||0:0,previousTop=opts.preserveScroll?document.getElementById('msgs')?.scrollTop||0:0;let memberIds=room.membersSnapshot?.length?room.membersSnapshot:(room.participants?.length?room.participants:(roomInfo(room).members||[]));let activeIds=room.activeIds?.length?room.activeIds:Object.keys(room.ready||{});let pendingIds=room.pendingIds||[];let isActive=activeIds.includes(db.user.id);let isPending=pendingIds.includes(db.user.id);if(sb&&authReady&&!room.messagesLoaded&&!isPending){let q=await sb.rpc('list_room_messages',{p_limit:100,p_room:id});if(q.error){toast(apiError(q.error));return}let rows=q.data||[];room.messages=normalizeRoomMessages(rows);room.messageHasMore=rows.length>=100;room.messageOldestId=room.messages[0]?.serverId||null;room.messagesLoaded=true;room.unreadCount=0;save()}markRoomRead(id);let r=roomInfo(room);let names={};if(sb&&authReady&&memberIds.length){let q=await sb.rpc('list_room_participants',{p_room:id});if(!q.error)for(const x of q.data||[])names[x.user_id]=x.display_name}chatList.style.display='none';chatRoom.style.display='block';chatRoom.dataset.openRoom=id;let allReady=!room.closed&&activeIds.length>0&&activeIds.every(m=>room.ready[m]);let activeSet=new Set(activeIds);let memberLabels=memberIds.filter(m=>room.closed?true:activeSet.has(m)).map(m=>{let label=m===r.hostId?'募集主':'匿名プレイヤー';let menu=m!==db.user.id?` <button class="mini" onclick="event.stopPropagation();openUserActions('${m}','${room.id}','${room.recruitmentId}')">⋯</button>`:'';return `<span class="badge">${m===r.hostId?'👑 ':''}${esc(label)}${!room.closed&&room.ready[m]?' ✓':''}${menu}</span>`}).join('');let pendingLabels=pendingIds.map(m=>`<span class="badge hot">⏳ ${esc('匿名プレイヤー')}</span>`).join('');let status=room.closed?'この募集は閉じられています。チャット履歴は閲覧できます。':isPending?'参加申請を送信済みです。募集主の承認待ちです。':(!isActive?'このパーティーから退出済みです。チャット履歴を閲覧できます。':((r.hostId===db.user.id&&pendingIds.length)?`参加申請が${pendingIds.length}件あります。チャット内で承認・拒否できます。`:(allReady?'全員準備OK。出発できます。':'準備OKを押して出発準備を確認。')));let approvalActions=(r.hostId===db.user.id&&pendingIds.length&&!room.closed)?`<div class="notice">🔔 参加申請</div>${pendingIds.map(m=>`<div class="room"><div><strong>${esc('匿名プレイヤー')}</strong><small>${esc(m.slice(0,8))}</small></div><div class="actions"><button class="btn primary" onclick="approveRequest('${room.recruitmentId}','${m}')">承認</button><button class="btn danger" onclick="rejectRequest('${room.recruitmentId}','${m}')">拒否</button></div></div>`).join('')}`:'';

// 修正：募集が一覧に存在する場合（isRecruitmentActive(room.recruitmentId) === true）のみ「募集を閉じる」ボタンを表示。
// 不要な「」メッセージを削除。
let recActive = isRecruitmentActive(room.recruitmentId);
let actions=room.closed?`<div class="notice">${status}</div>`:isPending?`<div class="notice">${status}</div>`:(!isActive?`<div class="notice">${status}</div>`:(r.hostId===db.user.id&&memberIds.includes(db.user.id)?`${approvalActions}${recActive?`<div class="room-actions"><button class="btn danger" onclick="disbandRoom('${room.id}')">募集を閉じる</button></div>`:''}`:''));

let validMessages = (room.messages||[]).filter(filterSystemMsg);
let messagesHtml=isPending?`<div style="text-align:center;padding:40px 10px;color:var(--muted)">参加申請の承認待ちです。<br>募集主に承認されるとチャット内容が表示されます。</div>`:(`${room.messageHasMore?`<div style="text-align:center;margin-bottom:10px"><button class="btn" onclick="loadOlderMessages('${room.id}')">${room.loadingOlder?'読み込み中…':'過去のメッセージを読み込む'}</button></div>`:''}${validMessages.map(m=>`<div class="msg ${m.uid===db.user.id?'me':''}"><small>${esc(m.name)} · ${new Date(m.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small>${esc(m.text)}</div>`).join('')}`);

let codeDisplay = isPending ? '承認待ちのため非表示' : '<b>' + esc(room.code) + '</b>';

chatRoom.innerHTML=`<div class="chatbox"><div class="chatinfo"><button class="btn" onclick="chatRoom.style.display='none';chatList.style.display='grid';delete chatRoom.dataset.openRoom">← 一覧</button><h3 style="margin:13px 0 5px">${esc(r.quest)}</h3><div class="sub">${esc(r.ship)} · ${Math.max(1,room.closed?memberIds.length:activeIds.length)}/${(r.max||Math.max(1,activeIds.length-1))+1} · ${room.closed?'過去のチャット':'合流コード '+codeDisplay}</div><div class="badges" style="margin-bottom:0">${memberLabels}${pendingLabels}</div><div class="sub" style="margin-top:8px">${status}</div></div><div class="messages" id="msgs">${messagesHtml}</div>${room.closed||!isActive||isPending?'':`<div class="composer"><button class="btn ${room.ready[db.user.id]?'primary':''}" onclick="toggleReady('${room.id}')">${room.ready[db.user.id]?'✓ 準備OK':'準備OK'}</button><input id="msgInput" maxlength="500" placeholder="" onkeydown="if(event.key==='Enter')sendMsg('${room.id}')"><button class="btn primary" onclick="sendMsg('${room.id}')">送信</button></div>`}${actions}</div>`;setTimeout(()=>{let m=document.getElementById('msgs');if(!m)return;if(opts.preserveScroll)m.scrollTop=Math.max(0,m.scrollHeight-previousHeight+previousTop);else m.scrollTop=m.scrollHeight},0)}
async function toggleReady(id){
  id=safeId(id);if(!id)return toast('不正なルームIDです');if(backendConfigured()&&!requireBackend())return;if(!beginAction())return;try{let room=db.rooms.find(x=>x.id===id);if(!room)return;let v=!room.ready[db.user.id];if(sb&&authReady){let {error}=await sb.rpc('toggle_ready',{p_ready:v,p_room:id});if(error){toast(apiError(error));return}requestBackendRefresh(true);openRoom(id);return}room.ready[db.user.id]=v;save();openRoom(id)}finally{endAction()}}
async function sendMsg(id){
  id=safeId(id);if(!id)return toast('不正なルームIDです');if(backendConfigured()&&!requireBackend())return;let input=document.getElementById('msgInput'),text=input.value.trim();if(!text)return;if(text.length>500)return toast('メッセージは500文字以内です');if(!beginAction())return;try{if(sb&&authReady){let {error}=await sb.rpc('send_chat_message',{p_body:text,p_room:id});if(error){toast(apiError(error));return}requestBackendRefresh(true);openRoom(id);return}let room=db.rooms.find(x=>x.id===id);if(!room)return;room.messages.push({uid:db.user.id,name:displayUser(db.user),text,time:now()});room.lastActivity=now();save();openRoom(id)}finally{endAction()}}
async function disbandRoom(id){
  id=safeId(id);if(!id)return toast('不正なルームIDです');if(backendConfigured()&&!requireBackend())return;if(!confirm('募集を閉じますか？\nチャット履歴は残ります。'))return;if(!beginAction())return;try{if(sb&&authReady){let {error}=await sb.rpc('disband_room',{p_room:id});if(error){toast(apiError(error));return}chatRoom.style.display='none';chatList.style.display='grid';await loadBackendState();renderRooms();render();toast('募集を閉じました');return}let room=db.rooms.find(x=>x.id===id);if(!room)return;let r=db.recruitments.find(x=>x.id===room.recruitmentId);if(r&&r.hostId!==db.user.id)return;room.closed=true;room.lastActivity=now();if(r)r.expiresAt=0;save();chatRoom.style.display='none';chatList.style.display='grid';renderRooms();render();toast('募集を閉じました')}finally{endAction()}}
async function openTemplates(){if(sb&&authReady){let {data,error}=await sb.from('templates').select('id,name,body').order('created_at');if(!error)db.templates=(data||[]).map(x=>({id:x.id,name:x.name,text:x.body}))}openModal(`<h2>コメントテンプレート</h2><div class="notice">募集時にワンタップで入力できます。</div>${db.templates.map((t,i)=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.name)}</b><div class="comment" style="margin:6px 0">${esc(t.text)}</div><button class="btn danger" onclick="deleteTemplate(${i})">削除</button></div>`).join('')}<div class="formgrid"><div class="field"><label>テンプレ名</label><input id="tName" maxlength="30"></div><div class="field"><label>本文</label><input id="tText" maxlength="120"></div></div><div class="dialog-actions"><button class="btn" onclick="closeModal()">閉じる</button><button class="btn primary" onclick="addTemplate()">追加</button></div>`)}
async function addTemplate(){if(backendConfigured()&&!requireBackend())return;let name=tName.value.trim(),text=tText.value.trim();
  if(!name||!text)return toast('テンプレ名と本文を入力してください');
  if(name.length>30||text.length>120)return toast('テンプレートの長さを確認してください');if(sb&&authReady){let {error}=await sb.from('templates').insert({body:text,name,user_id:db.user.id});if(error){if(error.code==='23505'&&String(error.message||'').includes('templates_user_id_name_key'))return toast('同じ名前のテンプレートがあります');return toast(apiError(error));}await openTemplates();toast('テンプレートを追加しました');return}db.templates.push({name,text});save();openTemplates();toast('テンプレートを追加しました')}
async function deleteTemplate(i){if(backendConfigured()&&!requireBackend())return;let t=db.templates[i];if(sb&&authReady&&t?.id){let {error}=await sb.from('templates').delete().eq('id',t.id);if(error)return toast(apiError(error));await openTemplates();return}db.templates.splice(i,1);save();openTemplates()}
async function openReport(userId,recruitmentId,roomId){openModal(`<h2>ユーザーを通報</h2><div class="notice">通報は運営確認用です。非表示とは別の機能です。</div><div class="formgrid"><div class="field full"><label>理由</label><select id="reportReason"><option value="harassment">嫌がらせ・迷惑行為</option><option value="spam">スパム</option><option value="misrepresentation">募集内容との相違</option><option value="cheating">不正行為の疑い</option><option value="other">その他</option></select></div><div class="field full"><label>詳細（任意）</label><textarea id="reportDetails" maxlength="300" rows="4" placeholder="状況を簡潔に記入"></textarea></div></div><div class="dialog-actions"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn danger" onclick="submitReport('${userId}','${recruitmentId||''}','${roomId||''}')">通報する</button></div>`)}
async function submitReport(userId,recruitmentId,roomId){if(backendConfigured()&&!requireBackend())return;let reason=document.getElementById('reportReason').value,details=document.getElementById('reportDetails').value.trim();if(sb&&authReady){let {error}=await sb.rpc('create_report',{p_details:details,p_reason:reason,p_recruitment:recruitmentId||null,p_reported_user:userId,p_room:roomId||null});if(error){toast(apiError(error));return}closeModal();toast('通報を受け付けました');return}closeModal();toast('試作モードでは通報を記録できません')}
async function blockUser(id){if(backendConfigured()&&!requireBackend())return;if(id===db.user?.id)return;if(sb&&authReady){let {error}=await sb.rpc('create_block',{p_user:id});if(error)return toast(apiError(error));await loadBackendState();closeModal();render();toast('ユーザーを非表示にしました');return}if(!db.blocked.includes(id))db.blocked.push(id);save();closeModal();render();toast('ユーザーを非表示にしました')}
async function openBlocks(){if(sb&&authReady){let {data,error}=await sb.rpc('list_my_blocks');if(!error)db.blocked=(data||[]).map(x=>x.blocked_id)}openModal(`<h2>非表示ユーザー</h2><div class="notice">非表示はあなたにだけ適用されます。</div>${db.blocked.length?db.blocked.map((id,i)=>`<div class="room"><div><strong>ユーザー</strong><small>${esc(id.slice(0,12))}</small></div><button class="btn" onclick="unblock(${i})">解除</button></div>`).join(''):'<div class="empty">非表示ユーザーはいません。</div>'}<div class="dialog-actions"><button class="btn" onclick="closeModal()">閉じる</button></div>`)}
async function unblock(i){if(backendConfigured()&&!requireBackend())return;let id=db.blocked[i];if(sb&&authReady){let {error}=await sb.rpc('remove_block',{p_user:id});if(error)return toast(apiError(error));await loadBackendState();openBlocks();render();return}db.blocked.splice(i,1);save();openBlocks();render()}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&sb&&authReady)requestBackendRefresh(false);
});
window.addEventListener('pagehide',save);window.addEventListener('offline',()=>setBackendStatus('オフライン'));window.addEventListener('online',()=>{if(sb&&authReady){setBackendStatus('オンライン（匿名接続）');subscribeRealtime();requestBackendRefresh(false)}else initBackend()});db.recruitments.forEach(r=>{r.conditionTags=normalizeConditionTags(r.conditionTags)});save();render();initBackend();
</script></body></html>
